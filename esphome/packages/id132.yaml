# Device package for washing machines with software ID 132 (Miele W 8xx/9xx, such as the W 925).
#
# This software ID reports no operating state; Phase shows where a program is, and Active
# Actuators what is running. Faults read "Ok", "Active" or "Stored".

packages:
  freemdu: !include freemdu.yaml

binary_sensor:
  # On while the measured drum speed is above 100 rpm, from the start of a spin until the drum has
  # nearly run down; anti-crease tumbling stays below. Off with Phase Anti-crease/finish means the
  # drum has stopped. In two logs the door opened after a last reading of 211 and 241 rpm, before
  # the drum had stopped, which fits but does not pin down the moment the door is released
  - platform: freemdu
    property: spinning
    id: mdu_spinning
    name: Spinning
    device_class: moving
  # On while the door button would be refused: water in the drum, or the drum still spinning, as
  # the W 925's owner describes it. Worked out from Water Level and Spinning, because no such flag
  # has been found in the machine's memory. Any water the level switch reports holds the door:
  # draining from level 3 with the button held, it stayed shut for at least 20 s at level 1. The
  # drum threshold is Spinning's 100 rpm, see above. Like every value it is as old as the last
  # poll, so the door can open while it still reads on from a reading taken just before. Not
  # device_class: lock, which Home Assistant reads the other way round
  - platform: template
    id: mdu_door_interlock
    name: Door Interlock
    icon: mdi:lock
    lambda: |-
      if (std::isnan(id(mdu_water_level).state))
        return {};
      return id(mdu_spinning).state || id(mdu_water_level).state > 0;

text_sensor:
  - platform: freemdu
    property: selected_program
    format: text
    id: mdu_program
    name: Program
  - platform: freemdu
    property: program_options
    format: text
    id: mdu_options
    name: Options
  # Programming-mode features (child lock, extra rinse, higher water level, gentle spin), kept
  # across power cycles; empty when none is on
  - platform: freemdu
    property: special_features
    format: text
    id: mdu_special_features
    name: Special Features
    entity_category: diagnostic
  - platform: freemdu
    property: program_spin_setting
    format: text
    id: mdu_spin_setting
    name: Spin Setting
  - platform: freemdu
    property: program_phase
    format: text
    id: mdu_phase
    name: Phase
  # As the machine shows it: "2 13", "27" or "0", with no colon and leading zeros dark
  - platform: freemdu
    property: display_contents
    id: mdu_display_contents
    name: Display Contents
  - platform: freemdu
    property: active_actuators
    format: text
    id: mdu_active_actuators
    name: Active Actuators
    entity_category: diagnostic
  - platform: freemdu
    property: fault_f1
    id: mdu_fault_f1_water_level_switch
    name: Fault F1 Water Level Switch
    entity_category: diagnostic
  - platform: freemdu
    property: fault_f2
    id: mdu_fault_f2_ntc_thermistor
    name: Fault F2 NTC Thermistor
    entity_category: diagnostic
  - platform: freemdu
    property: fault_f3
    id: mdu_fault_f3_heater
    name: Fault F3 Heater
    entity_category: diagnostic
  - platform: freemdu
    property: fault_f4
    id: mdu_fault_f4_tachometer
    name: Fault F4 Tachometer
    entity_category: diagnostic
  - platform: freemdu
    property: fault_f5
    id: mdu_fault_f5_detergent_overdose
    name: Fault F5 Detergent Overdose
    entity_category: diagnostic
  - platform: freemdu
    property: fault_f6
    id: mdu_fault_f6_water_inlet
    name: Fault F6 Water Inlet
    entity_category: diagnostic
  - platform: freemdu
    property: fault_f7
    id: mdu_fault_f7_drainage
    name: Fault F7 Drainage
    entity_category: diagnostic
  - platform: freemdu
    property: fault_f8
    id: mdu_fault_f8_final_spin_speed
    name: Fault F8 Final Spin Speed
    entity_category: diagnostic
  - platform: freemdu
    property: fault_f9
    id: mdu_fault_f9_eeprom
    name: Fault F9 EEPROM
    entity_category: diagnostic

sensor:
  - platform: freemdu
    property: target_temperature
    id: mdu_target_temperature
    name: Target Temperature
    device_class: temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 0
  # Minutes to the end of the program, from the display; unknown during a delayed start, when the
  # display counts down to the start. The machine revises it early in a program (one Cottons 60
  # went from 1:51 to 1:01)
  - platform: freemdu
    property: remaining_time
    id: mdu_remaining_time
    name: Remaining Time
    unit_of_measurement: min
    device_class: duration
    accuracy_decimals: 0
    filters:
      - lambda: return x / 60.0f;
  # Minutes to the start during a delayed start, rounded up as the display shows them; unknown
  # otherwise, including while the delay is being set
  - platform: freemdu
    property: start_delay
    id: mdu_start_delay
    name: Start Delay
    unit_of_measurement: min
    device_class: duration
    accuracy_decimals: 0
    icon: mdi:timer-play-outline
    filters:
      - lambda: return std::ceil(x / 60.0f);
  - platform: freemdu
    property: water_level
    id: mdu_water_level
    name: Water Level
    state_class: measurement
    accuracy_decimals: 0
  - platform: freemdu
    property: water_level
    value: target
    id: mdu_water_level_target
    name: Water Level Target
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: freemdu
    property: tachometer_speed
    id: mdu_drum_speed
    name: Drum Speed
    unit_of_measurement: rpm
    state_class: measurement
    accuracy_decimals: 0
  - platform: freemdu
    property: tachometer_speed
    value: target
    id: mdu_drum_speed_target
    name: Drum Speed Target
    unit_of_measurement: rpm
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: freemdu
    property: ntc_resistance
    id: mdu_ntc_resistance
    name: NTC Resistance
    unit_of_measurement: "Ω"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: freemdu
    property: operating_time
    id: mdu_operating_time
    name: Operating Time
    unit_of_measurement: h
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - multiply: 0.000277778
