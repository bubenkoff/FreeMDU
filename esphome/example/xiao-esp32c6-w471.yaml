# Seeed XIAO ESP32-C6 with an SFH 7250 on the optical interface of a Miele W 471 (software ID 457).
# Everything but the machine's heater rating and your network comes from the packages;
# see README, "Installation with packages".

esphome:
  name: washing-machine
  friendly_name: Washing Machine

packages:
  freemdu:
    url: https://github.com/bubenkoff/FreeMDU
    ref: esphome
    files:
      - esphome/packages/xiao-esp32c6.yaml
      - esphome/packages/id457.yaml
      - path: esphome/packages/energy.yaml
        vars:
          # Replacement heating element for the W 471 S (Miele 11905530): 2.1 kW at 230 V
          heater_power: 2100W
          # Not measured on this machine: taken from a W 925 of the same era, measured part by part
          # (pump 100 W, tumbling 75 W, spins 250-330 W at 400-1450 rpm, standby 8 W; see README,
          # "Known heater ratings"), with the drum term fitted to the top speed
          running_power: 100W
          drum_power_per_1000_rpm: 150W
          standby_power: 8W

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  # Uses the API encryption key; uploads must be encrypted
  - platform: esphome
    encryption: {}
